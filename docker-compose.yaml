version: '3.9'

services:
  # ---- App Profile ----
  app-server:
    build: ./app_server
    container_name: app_server
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --backlog 4096
    volumes:
      - ./app_server:/app
      - ./logs:/data
    mem_limit: 1gb
    restart: on-failure
    depends_on:
      connected-car:
        condition: service_started
    ports:
      - "8000:8000"
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    profiles:
      - app

  nginx:
    build: ./nginx
    container_name: nginx_proxy
    ports:
      - "8080:80"
    depends_on:
      - app-server
    restart: on-failure
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    profiles:
      - app

  mobile_app:
    build: ./mobile_app
    container_name: mobile_app
    #command: python launcher.py
    depends_on:
      - nginx
    restart: on-failure
    profiles:
      - app

  connected-car:
    build: ./connected_car
    container_name: connected_car
    command: uvicorn simulator:app --host 0.0.0.0 --port 8001
    restart: on-failure
    profiles:
      - app

  # ---- Agent Profile ----
  ai_agent:
    build: ./ai_agent
    container_name: ai_agent
    command: python main.py
    volumes:
      - ./logs:/app/logs:ro
      - ./mobile_app:/app/source/mobile_app:ro
      - ./app_server:/app/source/app_server:ro
      - ./nginx:/app/source/nginx:ro
      - ./connected_car:/app/source/connected_car:ro
      - ./docker-compose.yaml:/app/source/docker-compose.yaml:ro
    environment:
      # 実行時にOpenAIのAPIキーを設定してください
      - OPENAI_API_KEY=
    profiles:
      - agent